data:
  data_dir: 'D:\CNN\数据集\dataset_pickle_14通道_64x64'
  output_base_dir: 'D:\CNN\预测结果（1.15）\RF'
  test_files:
    - 'CZ7_CPT13.pickle'
    - 'CZ7_CPT24.pickle'
  auto_select_test: false
  auto_test_count: 2
  output_subdir: 'RF_results'
  model_filename: 'rf_model.pkl'
  data_file_pattern: '*.pickle'

logging:
  log_dir: 'D:\CNN\预测结果（1.15）\RF'
  training_log_prefix: 'training_log'
  framework_log_prefix: 'framework_log'

model:
  target_param: qc  # qc/fs/u2
  input_mode: 'statistics'  # 'flatten_raster' 或 'statistics'
  selected_channels: [0, 1, 2, 3, 4, 5, 6, 9, 10, 11, 12, 13]
  crop_size: 2  # 仅在flatten_raster模式下使用

  n_estimators: 150
  criterion: 'squared_error'
  max_depth: 15
  min_samples_split: 20
  min_samples_leaf: 5
  max_features: 'sqrt'
  max_leaf_nodes: null
  min_impurity_decrease: 0.001
  min_weight_fraction_leaf: 0.0
  bootstrap: true
  oob_score: true
  n_jobs: -1  # -1表示使用所有CPU核心
  random_state: 42
  verbose: 0
  warm_start: false
  ccp_alpha: 0.0
  max_samples: null

  log_dir: logs
  percentile_file: percentile_bounds.json
  model_dir: .
  normalization_file: channel_normalization.json
  layer_index_mapping_file: layer_index_mapping.json
  target_stats_file: target_stats.json
  qc_scaler_file: qc_robust_scaler.pkl

model_type: RF
name: RF模型（单输出回归）

training:
  random_state: 42
  val_size: 0.1
  optimize_hyperparams: true
