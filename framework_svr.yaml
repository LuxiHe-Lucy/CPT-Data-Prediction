data:
  data_dir: 'D:\CNN\数据集\dataset_pickle_14通道_64x64'
  output_base_dir: 'D:\CNN\预测结果（1.15）\SVR'
  test_files:
    - 'CZ7_CPT13.pickle'
    - 'CZ7_CPT24.pickle'
  auto_select_test: false
  auto_test_count: 2
  output_subdir: 'SVR_results'
  model_filename: 'svr_model.pkl'
  data_file_pattern: '*.pickle'

logging:
  log_dir: 'D:\CNN\预测结果（1.15）\SVR'
  training_log_prefix: 'training_log'
  framework_log_prefix: 'framework_log'

model:
  target_param: qc  # qc/fs/u2
  input_mode: 'statistics'  # 'flatten_raster' 或 'statistics'
  selected_channels: [0, 1, 2, 3, 4, 5, 6, 9, 10, 11, 12, 13]
  crop_size: 8  # 仅在flatten_raster模式下使用

  kernel: 'rbf'  # 'linear', 'poly', 'rbf', 'sigmoid', 'precomputed'
  C: 10.0
  epsilon: 0.05
  gamma: 'scale'  # 'scale', 'auto', 或浮点数
  degree: 3  # 仅当kernel='poly'时有效
  coef0: 0.0
  shrinking: true
  tol: 0.001
  cache_size: 200  # MB
  verbose: false
  max_iter: -1  # -1表示无限制

  log_dir: logs
  percentile_file: percentile_bounds.json
  model_dir: .
  normalization_file: channel_normalization.json
  layer_index_mapping_file: layer_index_mapping.json
  target_stats_file: target_stats.json
  qc_scaler_file: qc_robust_scaler.pkl

model_type: SVR
name: SVR模型（单输出回归）

training:
  random_state: 42
  val_size: 0.1